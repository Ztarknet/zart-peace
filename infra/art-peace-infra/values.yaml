namespace: art-peace-ztarknet

labels:
  redis:
    name: redis
  postgres:
    name: postgres
  backend:
    name: backend
  adminBackend:
    name: admin-backend
  consumer:
    name: consumer
  websocket:
    name: websocket
  indexer:
    name: indexer
  apibara:
    name: apibara-dna

ports:
  redis: 6379
  postgres: 5432
  backend: 8080
  adminBackend: 8082
  websocket: 8083
  consumer: 8081
  apibara: 7171

volumes:
  redis:
    name: redis-data
    class: standard-rwo
    storage: 10Gi
  postgres:
    name: postgres-data
    class: standard-rwo
    storage: 50Gi
  nfts:
    name: nft-data
    claim: nft-volume-claim
    class: standard-rwo
    storage: 50Gi
  worlds:
    name: worlds-data
    claim: worlds-volume-claim
    class: standard-rwo
    storage: 50Gi
  factions:
    name: faction-data
    claim: faction-volume-claim
    class: standard-rwo
    storage: 10Gi
  templates:
    name: template-data
    claim: template-volume-claim
    class: standard-rwo
    storage: 50Gi
  stencils:
    name: stencils-data
    claim: stencils-volume-claim
    class: standard-rwo
    storage: 50Gi
  apibara:
    name: apibara-data
    claim: apibara-volume-claim
    class: standard-rwo
    storage: 50Gi

deployments:
  sha: aabbccdd
  redis:
    replicas: 1
    image: redis
    tag: 7.2.4-alpine
  postgres:
    replicas: 1
    image: postgres
    tag: 14.11-alpine
  backend:
    replicas: 1
    image: brandonjroberts/zart-peace-backend
  adminBackend:
    replicas: 1
    image: brandonjroberts/zart-peace-backend
  consumer:
    replicas: 1
    image: brandonjroberts/zart-peace-consumer
  websocket:
    replicas: 1
    image: brandonjroberts/zart-peace-websocket
  indexer:
    replicas: 1
    image: brandonjroberts/zart-peace-indexer
  indexerWorlds:
    image: brandonjroberts/zart-peace-worlds-indexer
  apibara:
    replicas: 1
    image: quay.io/apibara/starknet
    tag: 1.7.2

postgres:
  db: art-peace-db
  user: art-peace-user
  password: ArtPeacePassword1234

turboda:
  apiKey: availTurboDaApiKey1234

apibara:
  # Self-hosted DNA server configuration for ztarknet
  rpcUrl: https://ztarknet-madara.d.karnot.xyz/rpc
  streamName: ztarknet
  headRefreshIntervalMs: 1000
  # Stream URL for indexer (uses internal service)
  # Note: This will be templated in indexer-configmap.yaml to use .Values.namespace
  indexerId: canvas-worlds-indexer-id
  authToken: dna_aabbcc

contracts:
  artPeace: 0x067883deb1c1cb60756eb6e60d500081352441a040d5039d0e4ce9fed35d68c1
  usernameStore: 0x03d9ac2a08d83dcbcf7a05358dd77e05d2b094d3c13232611fe86ee957c34d02
  nft: 0x042dbc0bbdb0faaad99d0b116d0105f9e213ac0d2faf75c878f49d69b544befb
  host: "0x58b5937b637279a5094f3d40ad5ff55d24d3f66e0ef9de6cfaccf1d2a87abc6"
  end: "2040474000"
  roundNumber: "3"
  canvasFactory: 0x58ea7c38b6d250ea19afa6917570bf8c97c0ae8a3a438a29e3cc3552a51ddfa
  worldsMode: true

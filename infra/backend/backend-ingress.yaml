apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: zart-peace-static-ip
    networking.gke.io/managed-certificates: zart-peace-managed-cert
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - path: /ws
    pathType: Exact
    backend:
      service:
        name: consumer
        port:
          number: 8081
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
